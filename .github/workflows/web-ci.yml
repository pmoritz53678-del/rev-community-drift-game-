name: Schoolyard Web Checks
on:
  push:
    branches:
      - feature/ue5-drift-academy-v0
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: rev-schoolyard-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Node tests
        run: npm test
      - name: Build prototype
        run: npm run build
      - name: Install headless Chromium for gameplay smoke test
        run: npx playwright install --with-deps chromium
      - name: Test game UI, driving and garage in a browser
        run: npm run test:e2e
      - name: Save browser screenshots and error traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-schoolyard-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
      - name: Save built files
        uses: actions/upload-artifact@v4
        with:
          name: rev-schoolyard-web
          path: web/dist/
          if-no-files-found: error
